<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BABYGRAM Token ($BABYGRAM) - TON Blockchain</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.05);
            --primary: #0088cc;
            --accent: #00d2ff;
            --text: #ffffff;
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Glow background effects */
        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
        }
        .glow-1 { top: -10%; left: 50%; transform: translateX(-50%); width: 500px; height: 500px; background: rgba(0, 210, 255, 0.2); }
        .glow-2 { bottom: 10%; right: -10%; width: 400px; height: 400px; background: rgba(0, 136, 204, 0.15); }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(45deg, #00d2ff, #0088cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero {
            text-align: center;
            padding: 80px 0 50px;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 15px;
            background: linear-gradient(180deg, #ffffff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-dim);
            max-width: 600px;
            margin: 0 auto 30px;
        }

        .cta-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(45deg, #0088cc, #00d2ff);
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.7);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* CA Box */
        .ca-box {
            background: var(--card-bg);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin: 40px auto;
            max-width: 700px;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .ca-title {
            font-size: 0.9rem;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .ca-address {
            font-family: monospace;
            font-size: 0.95rem;
            word-break: break-all;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            color: #00d2ff;
        }

        /* Tokenomics */
        .tokenomics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 60px 0;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .card h3 {
            color: var(--text-dim);
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--accent);
        }

        footer {
            text-align: center;
            padding: 30px 0;
            color: var(--text-dim);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
